version: "3"

env:
  UV: "{{.HOME}}/.local/bin/uv"
  BUN: "{{.HOME}}/.bun/bin/bun"
  BUNX: "{{.HOME}}/.bun/bin/bunx"
  LD_LIBRARY_PATH: "{{.USER_WORKING_DIR}}/.venv/lib/python3.12/site-packages/nvidia/cudnn/lib:{{.USER_WORKING_DIR}}/.venv/lib/python3.12/site-packages/nvidia/cublas/lib:{{.USER_WORKING_DIR}}/.venv/lib/python3.12/site-packages/nvidia/cuda_runtime/lib:{{.USER_WORKING_DIR}}/.venv/lib/python3.12/site-packages/nvidia/nccl/lib"

tasks:
  # ────────────────────────────────────────
  # ヘルプ
  # ────────────────────────────────────────
  default:
    desc: クイックガイド
    cmds:
      - |
        cat <<'EOF'
        ■ セットアップ（初回のみ）
          task setup

        ■ 開発・実行
          task dev                      ローカル実行
          task up                       systemd起動
          task down                     systemd停止
          task restart                  systemd再起動
          task status                   全体状態確認
          task logs                     ログ追尾

        ■ 録音・処理（メイン機能）
          task record                   手動録音
          task process FILE=録音.wav    1ファイル処理
          task process:all              全録音を一括処理

        ■ 小説生成
          task novel:build              今日の要約から章を生成
          task novel:build date=YYYYMMDD 指定日の章を生成
          task photo novel=data/novels/YYYYMMDD.md 小説から画像生成
          task photos:all               全小説から画像を一括生成

        ■ Windows 起動
          ダブルクリック: windows\run.bat
        ■ 初回セットアップ（管理者権限で実行）
          windows\bootstrap.bat

        ■ データ同期
          task sync                     Supabase同期
          task sync:full                全件強制同期

        ■ Web UI
          task web:dev                  開発サーバー
          task web:build                本番ビルド
          task web:deploy               Vercelデプロイ

        ■ メンテナンス
          task lint                     コード品質チェック
          task clean                    キャッシュ削除
          task commit MESSAGE="..."     Git commit
          task vault:sync               Prompt Vault から Kafka 設定を同期

        ■ デバッグ用
          task service:status           systemd状態のみ
          task log:status               ログ解析のみ
          task transcribe FILE=...      文字起こしのみ
          task summarize FILE=...       要約のみ
        EOF

  # ────────────────────────────────────────
  # セットアップ
  # ────────────────────────────────────────
  setup:
    desc: 依存同期
    cmd: $UV sync --frozen

  lock:
    desc: Python依存ロック更新
    cmd: $UV lock

  # ────────────────────────────────────────
  # 開発・実行
  # ────────────────────────────────────────
  dev:
    desc: アプリ実行
    cmd: $UV run python -m src.main

  up:
    desc: systemd日次タイマー起動
    cmds:
      - systemctl --user link --force "$(pwd)/vlog.service" "$(pwd)/vlog-daily.service" "$(pwd)/vlog-daily-failure.service" "$(pwd)/vlog-daily.timer"
      - systemctl --user daemon-reload
      - systemctl --user disable --now vlog.service
      - systemctl --user enable --now vlog-daily.timer

  systemd:install:
    desc: systemdユニットを再リンクして反映
    cmd: bash scripts/install_systemd_units.sh
  down:
    desc: systemd日次タイマー停止
    cmds:
      - systemctl --user disable --now vlog.service vlog-daily.timer

  restart:
    desc: systemd日次タイマー再起動
    cmd: systemctl --user restart vlog-daily.timer

  status:
    desc: Windows・systemd・日次タイマー・ログの状態確認
    cmds:
      - powershell.exe -NoProfile -Command "Get-ScheduledTask -TaskName VlogAutoDiary | Select-Object TaskName,State | Format-Table -AutoSize"
      - systemctl --user show vlog.service vlog-daily.timer -p Id -p LoadState -p ActiveState -p SubState -p UnitFileState
      - systemctl --user list-timers vlog-daily.timer --all --no-pager
      - journalctl --user -u vlog.service -u vlog-daily.service --no-pager -n 20

  logs:
    desc: ログ追尾（リアルタイム）
    cmd: journalctl --user -u vlog-daily.service -f

  # ────────────────────────────────────────
  # 録音・処理
  # ────────────────────────────────────────
  record:
    desc: 手動録音開始
    cmd: $UV run python -m src.cli record

  process:
    desc: 録音→要約（単一ファイル）
    deps: [require_file]
    cmds: ["$UV run python -m src.cli process --file {{.FILE}} {{.EXTRA}}"]

  process:all:
    desc: 録音→要約（全ファイル一括）
    cmds:
      - for f in data/recordings/*.wav data/recordings/*.flac; do [ -f "$f" ] && task process FILE="$f" EXTRA="--no-sync"; done || true
      - task sync

  process:today:
    desc: 今日の録音を一括処理（要約は再生成）
    cmds:
      - |
        TODAY=$(date +%Y%m%d)
        for f in data/recordings/${TODAY}*.wav data/recordings/${TODAY}*.flac; do
          [ -f "$f" ] && task process FILE="$f" EXTRA="--no-sync"
        done || true
      - task sync

  process:yesterday:
    desc: 昨日の録音を一括処理
    cmds:
      - |
        YESTERDAY=$(date -d "yesterday" +%Y%m%d)
        for f in data/recordings/${YESTERDAY}*.wav data/recordings/${YESTERDAY}*.flac; do
          [ -f "$f" ] && task process FILE="$f" EXTRA="--no-sync"
        done || true
      - task sync

  process:daily:
    desc: 日次処理（昨日＋今日）
    cmds:
      - $UV run python -m src.cli check-vrc || (echo "⚠️ VRChat running. Aborting heavy processing." && exit 0)
      - $UV run python -m src.cli daily

  curator:eval:
    desc: コンテンツ評価 (The Curator)
    cmds:
      - $UV run python -m src.cli curator eval --date {{.date}}

  process:pending:
    desc: 未処理データを検出して一括処理
    cmd: $UV run python -m src.cli pending

  transcribe:all:
    desc: 文字起こしのみ（全ファイル）
    cmds:
      - for f in data/recordings/*.wav data/recordings/*.flac; do [ -f "$f" ] && task transcribe FILE="$f"; done || true

  # ────────────────────────────────────────
  # データ同期
  # ────────────────────────────────────────
  sync:
    desc: Supabase同期
    cmd: $UV run python -m src.cli sync

  sync:full:
    desc: 全件強制同期
    cmds:
      - touch data/summaries/*.txt
      - task sync

  # ────────────────────────────────────────
  # Web UI
  # ────────────────────────────────────────
  web:lock:
    desc: フロントエンド依存ロック更新
    cmd: cd frontend/reader && $BUN install

  web:setup:
    desc: フロントエンド依存同期
    cmd: cd frontend/reader && $BUN ci

  web:dev:
    desc: 開発サーバー
    deps: [web:setup]
    cmd: cd frontend/reader && $BUN run dev -- --hostname 0.0.0.0 --port 3000

  web:build:
    desc: 型・Lint・本番ビルド
    deps: [web:setup]
    cmds:
      - cd frontend/reader && $BUN run typecheck
      - cd frontend/reader && $BUN run lint
      - cd frontend/reader && $BUN run build

  web:start:
    desc: 本番起動（ポート4000）
    deps: [web:setup]
    cmd: cd frontend/reader && $BUN run start -- --hostname 0.0.0.0 --port 4000

  web:deploy:
    desc: Vercelデプロイ
    deps: [web:build]
    cmds:
      - cd frontend/reader && $BUNX vercel link --project kaflog --yes
      - cd frontend/reader && $BUNX vercel --prod --yes

  web:env:
    desc: 環境変数抽出
    cmds:
      - test -f .env || (echo ".env がありません" && exit 1)
      - |
        . ./.env
        cat >frontend/reader/.env.local <<EOF
        NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        EOF

  # ────────────────────────────────────────
  # メンテナンス
  # ────────────────────────────────────────
  lint:
    desc: コード品質チェック
    cmds: ["$UV run ruff check src tests && $UV run ruff format src tests"]

  test:
    desc: テスト実行
    cmd: $UV run pytest tests

  systemd:verify:
    desc: systemdユニット検証
    cmd: systemd-analyze --user verify vlog.service vlog-daily.service vlog-daily-failure.service vlog-daily.timer

  notify:daily-failure:
    desc: 日次処理失敗通知
    cmds:
      - $UV run python -m src.cli error record --stage scheduler --kind daily_pipeline_failed --task-name daily_pipeline --reason "vlog-daily.service failed"
      - $UV run python -m src.cli notify --message "❌ 日次処理が失敗しました（$(date '+%Y-%m-%d %H:%M:%S')）"

  log:errors:
    desc: 構造化エラーログを表示
    vars:
      DAYS: '{{.DAYS | default "30"}}'
    cmd: $UV run python -m src.cli error report --days {{.DAYS}}

  typecheck:
    desc: Python型検査
    cmd: $UV run ty check src tests

  clean:
    desc: キャッシュ削除
    cmds:
      [
        "rm -rf __pycache__ .ruff_cache && find . -type d -name __pycache__ -exec rm -rf {} + || true",
      ]

  commit:
    desc: Git commit
    cmds: ["git add . && git commit -am '{{.MESSAGE}}'"]

  # ────────────────────────────────────────
  # Prompt Vault 連携
  # ────────────────────────────────────────
  vault:sync:
    desc: Prompt Vault から Kafka の最新アイデンティティを同期
    cmd: $UV run python scripts/sync_vault_prompts.py

  # ────────────────────────────────────────
  # 自律的メンテナンス (VAMS)
  # ────────────────────────────────────────
  maintenance:
    desc: システム自律クリーンアップ・整合性チェック
    cmds:
      - task lint
      - task doc:check
      - export PYTHONPATH=$PYTHONPATH:.
      - echo "Maintenance complete. Check for any suggested refactors or ADR updates."

  doc:check:
    desc: ドキュメントのポインタ整合性チェック
    cmds:
      - |
        ERR=0
        for p in $(grep -rh "file:///" AGENTS.md .claude/rules/ | sed -n 's/.*(file:\/\/\([^)]*\)).*/\1/p'); do
          if [ ! -e "$p" ]; then
            echo "Broken pointer: $p"
            ERR=1
          fi
        done
        exit $ERR

  audit:
    desc: 厳格な証拠監査を実行
    cmds:
      - $UV run python -m src.cli audit --strict --recent 100 --trace-window-minutes 30

  audit:publication:
    desc: 直近3か月の公開品質を監査
    vars:
      DAYS: '{{.DAYS | default "92"}}'
    cmd: $UV run python -m src.scripts.audit_publication --days {{.DAYS}}

  # ────────────────────────────────────────
  # Graph Scribe (シンプルグラフ)
  # ────────────────────────────────────────
  graph:ingest:
    desc: 全要約からグラフデータを抽出
    cmd: $UV run python -m src.cli pending
    # cmd_pending がグラフ抽出を含むようになったため、pending を呼ぶだけでOK
    # 明示的に呼びたい場合は専用のCLIコマンドを作るが、今はpendingに統合。

  # ────────────────────────────────────────
  # Cognee ナレッジグラフ
  # ────────────────────────────────────────
  cognee:init:
    desc: Cognee キュー初期化
    cmd: $UV run python scripts/init_cognee_queue.py

  cognee:ingest:
    desc: Cognee キューから次のバッチを処理
    env:
      COGNEE_SKIP_CONNECTION_TEST: "true"
    cmd: $UV run python scripts/ingest_to_cognee.py

  cognee:status:
    desc: Cognee キュー状況表示
    cmd: |
      $UV run python -c "
      import yaml
      q = yaml.safe_load(open('data/cognee_queue.yaml'))
      files = q['files']
      total = len(files)
      stats = {}
      for f in files:
          stats[f['status']] = stats.get(f['status'], 0) + 1
      print(f'Total: {total}')
      for s in ['completed','pending','processing','failed']:
          if s in stats: print(f'  {s}: {stats[s]}')
      failed = [f for f in files if f['status'] == 'failed']
      if failed:
          print('Failed files:')
          for f in failed:
              print(f'  - {f[\"name\"]}: {f[\"error\"]}')
      "

  # ────────────────────────────────────────
  # デバッグ用
  # ────────────────────────────────────────
  service:status:
    desc: systemd日次タイマー状態のみ
    cmd: systemctl --user status vlog-daily.timer vlog-daily.service

  transcribe:
    desc: 文字起こしのみ
    deps: [require_file]
    cmds: ["$UV run python -m src.cli transcribe --file {{.FILE}}"]

  summarize:
    desc: 要約のみ
    deps: [require_file]
    cmds: ["$UV run python -m src.cli summarize --file {{.FILE}}"]

  # ────────────────────────────────────────
  # 小説生成
  # ────────────────────────────────────────
  novel:build:
    desc: 小説の章を生成
    cmds:
      - $UV run python -m src.cli novel {{if .date}}--date {{.date}}{{end}}

  photo:
    desc: 小説から画像を生成
    cmds:
      - $UV run python -m src.cli image-generate --novel-file {{.novel}} --output-file data/photos/$(basename {{.novel}} .md).png
    preconditions:
      - sh: test -n "{{.novel}}"
        msg: novel=data/novels/YYYYMMDD.mdを指定してください

  photos:
    desc: 全小説から画像を一括生成
    cmds:
      - for f in data/novels/*.md; do [ -f "$f" ] && task photo novel="$f"; done || true

  manga:
    desc: 小説から4コマ漫画を生成
    cmds:
      - $UV run python -m src.cli manga --novel-file {{.novel}}
    preconditions:
      - sh: test -n "{{.novel}}"
        msg: novel=data/novels/YYYYMMDD.mdを指定してください

  mangas:
    desc: 全小説から4コマ漫画を一括生成
    cmds:
      - for f in data/novels/*.md; do [ -f "$f" ] && task manga novel="$f"; done || true

  # ────────────────────────────────────────
  # 内部ヘルパー
  # ────────────────────────────────────────
  require_file:
    internal: true
    preconditions:
      - sh: test -n "{{.FILE}}"
        msg: FILEを指定してください

  # ────────────────────────────────────────
  # Serena MCP
  # ────────────────────────────────────────
  serena:onboarding:
    desc: Serenaプロジェクトの初期化（インデックス作成）
    cmds:
      - serena project index

  serena:start:
    desc: Serena MCPサーバーの起動
    cmds:
      - serena start-mcp-server

  # ────────────────────────────────────────
  # ロギング・モニタリング
  # ────────────────────────────────────────
  monitor:daily:
    desc: 日次処理の実行結果を確認
    cmds:
      - echo "■ 最新実行ログ"
      - test -f /tmp/vlog-daily.log && tail -20 /tmp/vlog-daily.log || echo "No log file yet"
      - echo ""
      - echo "■ systemd タイマー状態"
      - systemctl --user list-timers vlog-daily.timer
      - echo ""
      - echo "■ 直近 24 時間のサービス実行記録"
      - journalctl --user -u vlog-daily.service --since "24 hours ago" -o short

  log:daily:
    desc: vlog-daily.service のジャーナルログを表示
    cmds:
      - journalctl --user -u vlog-daily.service --no-pager

  log:clear:
    desc: vlog-daily.log をクリア（新しい週の開始時）
    cmds:
      - rm -f /tmp/vlog-daily.log && echo "✅ Log cleared"

  health:check:
    desc: システムヘルスチェック
    cmds:
      - |
        echo "■ Timer Status"
        systemctl --user is-active vlog-daily.timer && echo "✅ Timer: ACTIVE" || echo "❌ Timer: INACTIVE"
        echo ""
        echo "■ Latest Run Result"
        LATEST=$(journalctl --user -u vlog-daily.service -n 1 --output=short)
        echo "$LATEST" | grep -q "started\|completed" && echo "✅ Last run appears successful" || echo "❌ Last run may have failed"
        echo "$LATEST"
        echo ""
        echo "■ Supabase Sync Status"
        task sync &>/dev/null && echo "✅ Supabase: ACCESSIBLE" || echo "⚠️  Supabase: PAUSED or UNREACHABLE"
        echo ""
        echo "■ Persona Distillation"
        test -d data/skills/vlog_user && echo "✅ vlog_user skill: EXISTS" || echo "❌ vlog_user skill: NOT FOUND"

  # ────────────────────────────────────────
  # dot-skill 連携
  # ────────────────────────────────────────
  dot-skill:distill:
    desc: 要約データからユーザーペルソナを蒸留
    cmd: export PYTHONPATH=$PYTHONPATH:. && $UV run python scripts/distill_user_persona.py
