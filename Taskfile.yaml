version: "3.52.0"

env:
  UV: "uv"
  BUN: "bun"

tasks:
  default:
    desc: 利用可能なrepository taskを表示
    cmd: task --list

  setup:
    desc: Python依存を同期
    cmd: $UV sync --locked --extra gpu

  dev:
    desc: capture serviceをforeground実行
    cmd: $UV run --frozen vlog-service

  web:setup:
    desc: Reader依存を同期
    cmd: cd apps/reader && $BUN install --frozen-lockfile

  web:dev:
    desc: Reader開発server
    deps: [web:setup]
    cmd: cd apps/reader && $BUN run dev -- --hostname 0.0.0.0 --port 3000

  web:build:
    desc: Readerを検証してbuild
    deps: [web:setup]
    cmds:
      - cd apps/reader && $BUN run typecheck
      - cd apps/reader && $BUN run lint
      - cd apps/reader && $BUN run build

  web:deploy:
    desc: clean mainをproductionへdeploy
    deps: [web:build]
    cmd: $UV run --frozen python scripts/deploy_reader.py

  web:env:
    desc: Reader開発envを生成
    cmd: $UV run --frozen python scripts/write_reader_env.py

  lint:
    desc: Python lint/formatをread-only検証
    cmds:
      - $UV run --frozen ruff check apps/capture-vrchat/src packages adapters scripts tests infra/systemd
      - $UV run --frozen ruff format --check apps/capture-vrchat/src packages adapters scripts tests infra/systemd

  format:
    desc: Python lint/formatを修正
    cmds:
      - $UV run --frozen ruff check --fix apps/capture-vrchat/src packages adapters scripts tests infra/systemd
      - $UV run --frozen ruff format apps/capture-vrchat/src packages adapters scripts tests infra/systemd

  typecheck:
    desc: Python型検査
    cmd: $UV run --frozen ty check apps/capture-vrchat/src packages tests infra/systemd

  test:
    desc: Python test
    cmd: $UV run --frozen pytest -q

  doc:check:
    desc: repository/Markdown境界を検証
    cmd: $UV run --no-sync python scripts/check_repository_boundaries.py

  systemd:install:
    desc: portable systemd unitsをinstall
    cmd: bash infra/systemd/install.sh

  systemd:verify:
    desc: systemd templatesを一時描画して検証
    cmd: |
      TMP_DIR=$(mktemp -d)
      trap 'rm -rf "$TMP_DIR"' EXIT
      $UV run --frozen python infra/systemd/render.py --root "{{.ROOT_DIR}}" --output "$TMP_DIR"
      systemd-analyze --user verify "$TMP_DIR"/*.service "$TMP_DIR"/*.timer

  audit:publication:
    desc: 公開品質を監査
    vars:
      DAYS: '{{.DAYS | default "92"}}'
    cmd: $UV run --frozen python -m vlog_capture.scripts.audit_publication --days {{.DAYS}}

  vault:sync:
    desc: Prompt Vaultから設定を同期
    cmd: $UV run --frozen python scripts/sync_vault_prompts.py

  cognee:ingest:
    desc: Cognee projectionの次batchを処理
    env:
      COGNEE_SKIP_CONNECTION_TEST: "true"
    cmd: $UV run --extra cognee python scripts/ingest_to_cognee.py

  cognee:status:
    desc: Cognee projection queueを表示
    cmd: $UV run --frozen python scripts/cognee_status.py

  persona:distill:
    desc: runtime summariesからpersona skillを生成
    cmd: $UV run --frozen python scripts/distill_user_persona.py

  verify:
    desc: repository-level full verification
    cmds:
      - task lint
      - task typecheck
      - task test
      - task doc:check
      - task systemd:verify
      - task web:build
