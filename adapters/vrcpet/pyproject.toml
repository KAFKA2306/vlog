[project]
name = "vlog-vrcpet"
version = "0.1.0"
description = "VLog private VRCPet/Muchio observation adapter"
requires-python = ">=3.12,<3.13"
dependencies = ["vlog-memory-domain"]

[tool.uv.sources]
vlog-memory-domain = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
