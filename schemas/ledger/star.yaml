dim_date:
  - date: 2026-08-04
    label: "ADR audit"
  - date: 2026-08-20
    label: "portability decisions"
dim_status:
  - name: Implemented
    meaning: "code、schema、tests、templateなどが対象commitに存在する。"
  - name: CI-verified
    meaning: "対象commitのrepository checksが成功した。"
  - name: Environment-verified
    meaning: "実host、deployment、database、storage、network、GPUなどを実測した。"
  - name: Historical
    meaning: "記録された日時・environmentにだけ成立する。"
  - name: Planned
    meaning: "採用済み方向性だがproduction implementationを意味しない。"
dim_doc:
  - path: docs/SPEC.md
    authority_class: "product contract"
    owner: "docs/SPEC.md"
    authority: "製品不変条件、保存境界、動作保証、完了判定"
