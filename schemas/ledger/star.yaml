fact_verification:
  - task: lint
    covers: "Python ruff check and format check"
    evidence_level: CI-verified
  - task: typecheck
    covers: "Python type check"
    evidence_level: CI-verified
  - task: test
    covers: "pytest suite"
    evidence_level: CI-verified
  - task: python:contract
    covers: "supported Python range, pin, CI, and path agreement"
    evidence_level: CI-verified
  - task: doc:check
    covers: "repository boundaries, Markdown links, generated ledger freshness"
    evidence_level: CI-verified
  - task: systemd:verify
    covers: "systemd unit rendering and verification"
    evidence_level: CI-verified
  - task: web:build
    covers: "Reader typecheck, lint, and build"
    evidence_level: CI-verified
