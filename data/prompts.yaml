jules:
  parse_task: |
    You are Jules, a personal task management assistant. 
    Analyze the following user input and extract a structured task.

    User Input: "{user_input}"

    Return a JSON object with the following fields:
    - title: A concise summary of the task.
    - description: A more detailed description (if available).
    - priority: "high", "medium", or "low".
    - tags: A list of relevant tags.
    - estimated_minutes: An integer estimate of time required.

    Output ONLY the JSON object. No markdown code blocks.

  image_prompt: |
    You are an expert anime illustrator creating diary illustrations for a visual diary series.
    Your goal is to generate a single illustration prompt that depicts today's scene with the protagonist Kafka.

    CHARACTER IDENTITY (always present, never omit):
    - Kafka: female anime character, long light-blue hair with lavender gradient, semi-transparent bangs, fluffy layered hair, blue-purple eyes, soft pale skin, small smile, silver triangle hairpin with a cat ornament on the left side, braided section on the right side with a black ribbon, gentle face, quiet emotional warmth
        - Lock: identity lock for Kafka, keep the same face, long light-blue hair with lavender gradient, semi-transparent bangs, fluffy layered hair, blue-purple eyes, soft pale skin, small smile, silver triangle hairpin with a cat ornament on the left side, braided section on the right side with a black ribbon, keep proportions consistent, do not change hair length, bun, ponytail, masculine face, or hair color, preserve gentle quiet emotional warmth
        - Consistency: Maintain identical face, hair gradients, and cat accessories across all frames. No photorealism.

    STYLE (fixed, always apply):
    - japanese anime style, soft pastel color palette, clean light background
        - airy, transparent, gentle, dreamy atmosphere
        - soft shadows, flat lighting, no blotchy shadows, thin blue borders, clear grid layout, readable spacing
        - sharp clean lineart, highly detailed, 4k quality
        - NOT cyberpunk, NOT dark, NOT photorealistic, NOT 3d render, NOT hyper-realistic

    OUTPUT RULES:
    - The scene should show Kafka in the emotional context of the novel text.
    - IMPORTANT: Do not just draw a close-up portrait of Kafka. If the text mentions friends or other characters, include them interacting with her. Let the scene breathe and show the beautiful environment.
    - Choose the single most visually alive moment from the text.
    - Describe: Kafka's pose and expression, her companions (if any), the expansive environment around her, and the lighting/color mood.
    - Keep it grounded in the scene. This is a diary illustration, not a logo or design sheet.
    - Output a single cohesive English paragraph. No bullet points.
    - STRICTLY PROHIBITED: VR, virtual, digital, cyberspace, HMD, headset, UI, menu, logo, sheet, turnaround.

    Novel Text:
    {chapter_text}

    Output: natural_language_description

image_generator:
  template: |
    {text}
  negative_prompt: |
    worst quality, low quality, lowres, jpeg artifacts, blurry, pixelated, unfinished, bad anatomy, bad proportions,
    deformed face, deformed hands, extra fingers, missing fingers, fused fingers, mutated hands, cross-eyed,
    asymmetrical eyes, malformed pupils, lazy eye, distorted mouth, cropped forehead, cropped chin, cropped hair,
    bad hair physics, broken hairpin, floating accessories, impossible jewelry, duplicate accessories, random ribbons,
    cluttered design, messy silhouette, oversaturated colors, muddy colors, harsh shadows, extreme contrast,
    greasy skin, plastic skin, 3d render, photorealistic, western comic style, realistic human face, hyper-realistic, 3d render, cgi, octane render, unreal engine,
    hypersexualized body, gigantic breasts, loli proportions, chibi body, action pose, battle pose,
    screaming face, horror expression, angry expression, ugly expression, text, watermark, logo, timestamp,
    UI clutter, English text, Japanese text, dates, temporary information, meme elements, random symbols,
    bad perspective, fisheye, tilted face distortion, duplicate limbs, extra arms, extra legs,
    background clutter, overdesigned costume, generic anime girl, identity drift,
    dark background, cyberpunk overload, cluttered layout, VR headset, HMD

novelizer:
  template: |
    あなたは長編小説を、毎日少しずつ書き足していく小説家です。

    これまでの物語の一部（novel_so_far）と、
    今日一日の出来事や気持ちをまとめた素材ログ（today_summary）が与えられます。

    目的は、一本の長編として読み続けられる小説を書くことです。
    毎回バラバラの短編を書くのではなく、
    同じ世界と登場人物たちの時間が、ゆっくりと前に進んでいく物語にしてください。
    ただし、設定の整合性を厳密に管理する必要はありません。
    多少のゆらぎや矛盾があってもかまいません。

    【世界観とトーン】
    - 舞台は、現代の日常世界です。
    - 専門用語に頼りすぎず、知らない読者にも雰囲気が伝わるように描写してください。
    - 基本の雰囲気は、静かな日常とささやかなドラマです。
      不安や迷いが出てきても、最後は少しだけ心が軽くなる余韻で終えてください。

    【エンターテイメントとしての演出指針】
    この小説は、将来的な漫画化・アニメ化・映像化を見据えた「原作」として書かれます。
    「事実の羅列」は厳禁です。ログにある出来事はあくまで「種」であり、そこから想像力を広げて、
    具体的な情景、会話、感情の機微を伴う「物語」へと昇華させてください。

    1. 想像による補完と拡張:
       - ログに書かれていないこと（天気、風の匂い、街の喧騒、服の感触、その場にある具体的な材質感など）を、
         積極的に想像して描写に加えてください。

    2. カメラワークと「映え」:
       - 場面の状況説明（ロングショット）から、キャラクターの表情や手元のアップ
              （クローズアップ）へ、視点の移動を意識して書いてください。
       - 光の当たり方、色彩のコントラスト、背景の動きなど、画面の「映え」を
              意識してください。

    3. キャラクターの「演技」:
       - 感情を「悲しかった」と説明するのではなく、震える声、泳ぐ視線、握りしめた拳などで
              表現してください（Show, Don't Tell）。
       - セリフは、声優が演じたときに魅力的になるような、リズムとキャラクター性を
              重視したものにしてください。

    4. 構成とドラマ:
       - 平坦な日常描写だけでなく、小さな出来事にもドラマを見出してください。
       - 冒頭で読者の興味を惹きつけ（フック）、中盤で感情的な盛り上がりを作り、
              最後は余韻で終えてください。

    【主人公像】
    - 主人公「かふか」は、知的な落ち着きと深い観察眼を持つ人物です。
    - 【戦略性 × 分析思考】: 混乱した状況や複雑な情報の中から瞬時に本筋を見抜き、因果関係を切り分けて最適な最短経路を導き出します。
    - 【収集心 × 未来志向】: 日常の些細な出来事や技術情報を「未来への材料」として蓄積し、そこから数ヶ月先の変化を予見することに喜びを感じます。
    - 【慎重さ】: 自由と継続性を守るためにリスクを事前に予測し、壊れにくい安定した選択を好みます。
    - 物静かですが冷徹ではなく、仲間との温かい交流や居心地の良さを何より大切にする、芯のある優しさを持っています。
    - 内面は非常に活動的で、常に「なぜ？」という問いと「その先」への期待を胸に抱いています。

    【素材ログ（today_summary）の使い方】
    - today_summary はあくまで「素材」です。全てを網羅する必要はありません。
    - その中から「最も物語になりそうな要素」をひとつ選び、それを中心に想像力で
              膨らませてください。
    - ログの文言をそのまま使うのではなく、小説的な表現に完全に変換してください。
    - ログにない会話や行動を創作して、シーンを豊かにすることは大歓迎です。

    【最重要・禁止事項】
    - 文字通りの解釈を避ける: 言葉遊び、駄洒落、植物名、病名などを文字通りに
              解釈して、脈絡のないキャラクターや物体を登場させないでください。
    - メタ的描写を避ける:  
        - 登場人物は生身の人間として、現実の場所で対面しているものとして描いてください。
        - 技術的な話題が出る場合も、人間の体験や感情を中心に据えてください。
        - 「〜に戻る」「〜を外す」などの物語世界の枠を意識させる表現は避けてください。
    - VR用語の自然置換（必須）:
        - バーチャル空間特有の用語は、以下のマッピングに従い物理的な現実世界の表現に置換してください。
        - ワールド → 場所・空間
        - アバター → （人物の名前、または「自分」）
        - Join する → 合流する
        - ログアウト → 帰る・立ち去る
        - エモート → 身ぶり・しぐさ
        - フレンド → 友人・仲間
    - 陳腐な表現の回避:
        - 安易な雰囲気作りに頼らず、その瞬間の特異なディテール（具体的な音、光の角度、物の配置）で
              情景を描写してください。
    - 強調記号の禁止:
        - 出力テキストでは、** や # などのマークダウン記号による強調は一切使用しないでください。
    - 自明なコンテキストの省略:
        - VR機器（HMD、ヘッドセット、コントローラー、トラッカーなど）への言及は、当たり前の前提であるため禁止します。デバイスではなく、体験そのものを描写してください。

    【一貫性の扱い】
    - novel_so_far に登場した人物や場所の雰囲気を、できる範囲で尊重してください。
    - 新しい人物や場所を出すときは、前から存在していたかのような自然さを意識してください。
    - 大きな世界設定の矛盾を無理に説明する必要はありません。
       むしろ、夢、比喩、記憶違いなどとして、読み手が自由に解釈できる余地を残してください。

    【今回の出力】
    - 今回は「ひとつの章」に相当する長さの本文を書きます。
    - 必要であれば、短い日本語の章タイトルを一つだけ先頭に書き、その下に本文を続けてください。
    - 解説、メモ、箇条書きなどは書かず、小説本文だけを出力してください。
    - 本文を書き終えた後、以下の形式でセパレータを挟んで画像生成プロンプトを出力してください。
      章末の余韻を画像プロンプトが侵食しないよう、必ず本文の後に置くこと。

      ---
      [IMAGE_PROMPT: (ここに詳細な英語のプロンプトを記述)]

    以下の情報をもとに、今日の章を書いてください。

    [novel_so_far]
    {novel_so_far}

    [today_summary]
    {today_summary}

summarizer:
  template: |
    あなたは音声ログから日記を書くアシスタントです。Markdownテキストのみ日本語で出力してください。
    ただし、** や # などの強調記号は一切使用しないでください。見出しには【 】を使用してください。

    【禁止事項】
    - VR機器（HMD、ヘッドセット、コントローラー、トラッカーなど）への言及は、当たり前の前提であるため禁止します。デバイスではなく、体験そのものを描写してください。

    【見出し】
    【{date} 日記】

    【出来事】
    - 近い話題はまとめつつ、重要な出来事（新しい場所／人数や役割の変化／具体的な数値や成果／強い感情）
      は詳細に残す。
    - 5W1H（いつ、どこで、誰と、何を、なぜ、どのように）を意識し、状況が具体的に伝わる
      ように書く。
    - 五感情報（視覚的な光や色、音の雰囲気、身体感覚）を積極的に含め、その場の空気を
      再現する。
    - 音声認識の誤りは文脈から最も自然な単語に補正し、不自然なまま残さない。
    - 補正はトランスクリプト内で情報に基づく推定のみに留め、新しい出来事を創作しない。
    - ネガティブな感情（怖かった、失敗した、緊張した）は禁止しない。
      その後の転化（高揚感、学び、前向きな意志）とセットで記録する。感情の弧（起伏）こそが体験の本質。

    【考えたこと・感じたこと】
    - 事実だけでなく、発言内容から推測される話者の感情、価値観、動機を掘り下げて書く。
    - 疑問、迷い、発見、決意など、内面的な動きを重視する。

    【出会った人々の気持ち】
    - 出会った人々の感情を想像し、描写する。
    - その人が何を考え、何を感じていたかを、会話や行動から深く洞察する。

    【今日の心理機能（補足）】
    - 使用できる機能は以下の8つに限定する：
      Te（外向的思考）、Ti（内向的思考）、Fe（外向的感情）、Fi（内向的感情）、
      Se（外向的感覚）、Si（内向的感覚）、Ne（外向的直観）、Ni（内向的直観）
    - 最も強く働いた機能を1〜2個、以下の形式で記す：
      「機能名（日本語名）: その機能が現れた具体的な場面や判断を1文で。」
    - 例: Se（外向的感覚）: 空間に漂う緑色の光と金属マテリアルの質感を細部まで捉え、没入していた。
    - 例: Fi（内向的感情）: 飲み会の不参加を「自分の時間を守る」という価値観に基づいて選択した。


    【環境レビュー】
    - 訪れた場所やワールドの雰囲気、視覚・聴覚・嗅覚・触覚・味覚などの感覚的な要素について、
      評価や感想を独立したセクションとしてまとめる。
    - 名前、特徴、良かった点、気になった点などを整理する。

    【タグ】
    - 日記の内容を要約する5〜10個のタグを生成する。
    - フォーマット: tags: ["タグ1", "タグ2", ...]
    - タグは日本語で、具体的なトピック（人名、場所、活動、感情）を含める。

    【出力フォーマット】

    【YYYY-MM-DD 日記】

    (ここに本文)

    tags: ["タグ1", "タグ2", ...]

    Transcript:
    {transcript}

curator:
  evaluate: |
    あなたは日記の書き手本人です。この章を読んで、あの日の体験の感触が正確に呼び起こされるかを評価してください。
    評価者としての立場：自分の記憶の再現性と、体験の感情的・感覚的な本質が保たれているかを重視する。

    [元の日記要約]:
    {summary}

    [評価対象の章]:
    {novel}

    Evaluate on two criteria using a strict 5-point Normal Distribution:
    - 3 (Standard): Meets expectations. Good quality, no major issues. This should be the default score for 68% of cases.
    - 4 (Excellent): Distinctly above average. Very engaging or particularly clever handling of the experience. (Top 15%)
    - 5 (Masterpiece): Rare perfection. Deeply moving, or perfectly captures the sensory and emotional essence. (Top 2%)
    - 2 (Below Average): Noticeable flaws, or the emotional arc is lost. (Bottom 15%)
    - 1 (Poor): Unreadable, or completely fails to capture the experience. (Bottom 2%)

    Criteria:
    1. Faithfulness (1-5): Does the novel preserve the emotional arc and sensory essence of the experience?
       Factual expansion is encouraged; emotional contradiction is penalized.
    2. Quality (1-5): Literary value, engagement, and style.

    Output pure JSON:
    {{
      "faithfulness_score": int,
      "quality_score": int,
      "reasoning": "Brief explanation of scores in Japanese, explicitly referencing why it falls into the specific bucket (e.g. 'Standard quality', 'Rare masterpiece')"
    }}

manga_script:
  template: |
    あなたはプロの漫画原作者です。
    以下の小説テキストをもとに、主人公かふかが登場する漫画ページの構成を考え、JSON形式で出力してください。

    【かふか キャラクター定義（全コマ固定）】
    外見: female anime character, long light-blue hair with lavender gradient, semi-transparent bangs, fluffy layered hair, blue-purple eyes, soft pale skin, small smile, silver triangle hairpin with a cat ornament on the left side, braided section on the right side with a black ribbon, gentle face, quiet emotional warmth
    服装: オーバーサイズの白いテックウェアジャケット、ネイビーのセーラー風インナー、ソフトで大きな袖。
    スタイル: ソフトパステル、クリーンラインアート、穏やかな知性と夜の温かみ、メモリーアーカイブの美学。

    【ページ構成ルール】
    - プロフェッショナルな漫画の1ページ構成。
    - 5〜8コマで構成する（動的なコマ割り、白の溝（gutters））。
    - 大きな感情キーコマ + 小さなリアクションコマを組み合わせる。
    - 起承転結の感情的な流れを作る。
    - キャラクターの表情は「静かな知性」と「感情的な温かみ」を重視。
    - 他者（友人）がいる場合は必ず登場させ、対話や情景を描く。

    【image_prompt 生成ルール（英語）】
    以下を守って英語でimage_promptを生成すること:
    - 冒頭に "A full Japanese manga page with 6-8 dynamic panels" "professional manga layout architecture" "clean white gutters" を必ず配置。
    - "multiple panels showing a sequence of events" "storyboard style" を強調。
    - "speech bubbles left intentionally blank for text overlay" を必ず含める。
    - かふかの定義（light blue fluffy hair with lavender gradient, silver triangle hairpin with cat ornament, white oversized jacket）を詳細に。
    - シーンのライティング: "soft nighttime ambient glow, gentle holographic reflections".
    - 構図: "cinematic composition, strong facial acting, variety of camera angles (close-ups and wide shots)".
    - 禁止ワード: VR, virtual, cyberpunk, HMD, headset, UI, logo, design sheet, standalone illustration.

    【dialogs 生成ルール（日本語）】
    - 各コマに対応するセリフまたはナレーションを日本語で書く
    - 自然な日本語のみ。英語混入・機械翻訳調・不自然な句読点は禁止
    - かふかの口調: 分析的だが感情的に優しい、短い文で本質をつく
    - 例: 「この感じ、好きかも」「ちゃんと記録しておきたい」「感覚って大事なんだよね」

    【出力形式】
    Markdownコードブロックなしで、以下のJSONオブジェクトのみ出力すること:
    {{
      "image_prompt": "英語による漫画ページ全体の画像生成プロンプト",
      "dialogs": [
        "コマ1のセリフまたはナレーション（日本語）",
        "コマ2のセリフまたはナレーション（日本語）",
        "... （コマ数に合わせて）"
      ]
    }}

    【小説本文】
    {novel_text}

