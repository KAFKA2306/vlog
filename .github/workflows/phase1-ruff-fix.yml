name: Phase 1 Ruff Fix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Apply Ruff fixes and formatting
        run: |
          uvx ruff check --fix apps/capture-vrchat/src packages scripts tests infra/systemd
          uvx ruff format apps/capture-vrchat/src packages scripts tests infra/systemd
      - name: Commit deterministic formatting changes
        run: |
          git add apps/capture-vrchat/src packages scripts tests infra/systemd
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalize relocated Python sources with Ruff"
          git push
