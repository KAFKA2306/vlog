name: Runtime Residual Finalizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/runtime-data-residuals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
      - name: Sync workspace
        run: uv sync --locked
      - name: Apply runtime-home finalization
        run: python scripts/finalize_runtime_residuals.py
      - name: Preserve explicit auditor storage roots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/capture-vrchat/src/vlog_capture/infrastructure/audit_v2.py")
          text = path.read_text(encoding="utf-8")
          old = '''        run_id: str | None = None,
                  run_log: Path | None = None,
                  trace_log: Path | None = None,
              ) -> None:
                  directories = runtime_directories()
                  self.run_id = run_id
                  self.run_log = run_log or directories.state / "daily_runs.jsonl"
                  self.trace_log = trace_log or directories.state / "traces.jsonl"'''
          new = '''        run_id: str | None = None,
                  run_log: Path | None = None,
                  trace_log: Path | None = None,
                  sync_report_dir: Path | None = None,
              ) -> None:
                  directories = runtime_directories()
                  self.run_id = run_id
                  self.run_log = run_log or directories.state / "daily_runs.jsonl"
                  self.trace_log = trace_log or directories.state / "traces.jsonl"
                  self.sync_report_dir = sync_report_dir or (
                      run_log.parent / "sync_reports"
                      if run_log is not None
                      else directories.state / "sync_reports"
                  )'''
          if old not in text:
              raise SystemExit("audit constructor fragment not found")
          text = text.replace(old, new, 1)
          old = '        path = runtime_directories().state / "sync_reports" / f"{run_id}.json"'
          new = '        path = self.sync_report_dir / f"{run_id}.json"'
          if old not in text:
              raise SystemExit("audit sync-report fragment not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove temporary finalizer
        run: git rm .github/workflows/runtime-taskfile-fix.yml scripts/finalize_runtime_residuals.py
      - name: Normalize and verify repository contracts
        shell: bash
        env:
          GOOGLE_API_KEY: test-key
        run: |
          uv run --no-sync ruff check --fix apps/capture-vrchat/src packages adapters scripts tests infra/systemd
          uv run --no-sync ruff format apps/capture-vrchat/src packages adapters scripts tests infra/systemd
          uv run --no-sync ruff check apps/capture-vrchat/src packages adapters scripts tests infra/systemd
          uv run --no-sync ruff format --check apps/capture-vrchat/src packages adapters scripts tests infra/systemd
          uv run --no-sync python scripts/check_runtime_contract.py
          uv run --no-sync python scripts/check_portable_paths.py
          uv run --no-sync vlog --help | grep -q record
          uv run --no-sync vlog novel --help | grep -q 'defaults to today'
          uv run --no-sync pytest -q
          output="$(mktemp -d)"
          uv run --no-sync python infra/systemd/render.py --root "$PWD" --output "$output"
          systemd-analyze --user verify "$output"/*.service "$output"/*.timer
      - name: Commit verified finalization
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(runtime): finish runtime-home migration'
          git push origin HEAD:${{ github.head_ref }}
