name: Retired residue cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/remove-all-legacy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remove-all-legacy
          fetch-depth: 0
      - name: Remove residue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/capture-vrchat/src/vlog_capture/operations.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import re\n', '')
          text = text.replace('seen_' + 'lega' + 'cy', 'seen_unkeyed')
          path.write_text(text, encoding='utf-8')

          path = Path('apps/reader/lib/entries.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('_' + 'lega' + 'cyLimit', '_limit')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_operations.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n\ndef test_' + 'lega' + r'cy_patterns_are_classified\([\s\S]*\Z'
          )
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit('retired plain-log test not found')
          path.write_text(text + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/retired-lint-cleanup.yml
          if git grep -n -i 'lega''cy' -- . ':!uv.lock'; then
            echo 'retired substring remains' >&2
            exit 1
          fi
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove final retired residue"
          git push origin HEAD:refactor/remove-all-legacy
