name: Export Source Tree

on:
  pull_request:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source snapshot
        run: tar --exclude=.git -czf /tmp/vlog-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: vlog-source-tree
          path: /tmp/vlog-source.tgz
          retention-days: 1
          if-no-files-found: error
