name: Apply Phase 1 Relocation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Restore exact patch baseline
        run: git checkout 184b8762ffd0ccc100ef7d7a0e65f023209b9b9b -- .github/workflows/export-source-tree.yml
      - name: Apply audited relocation patch
        run: |
          cat .phase1/patch.xz.b64.part-* | base64 --decode | xz --decompress > /tmp/phase1.patch
          git apply --index --binary --whitespace=error-all /tmp/phase1.patch
      - name: Refresh lockfile
        run: uv lock
      - name: Verify and commit final relocation tree
        run: |
          rm -rf .phase1
          git add -A
          git diff --cached --check
          test ! -e src
          test ! -e frontend/reader
          test -d apps/capture-vrchat/src
          test -f apps/reader/package.json
          test -d infra/systemd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: relocate runtime into Human Memory v2 boundaries"
          git push
