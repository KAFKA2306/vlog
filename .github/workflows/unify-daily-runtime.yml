name: Unify daily runtime

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  unify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/unify-daily-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/unify-daily-runtime
          fetch-depth: 0
      - name: Unify daily runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          handlers = Path('apps/capture-vrchat/src/vlog_capture/cli_handlers.py')
          text = handlers.read_text(encoding='utf-8')
          text = text.replace('import asyncio\n', '')
          text = text.replace('from vlog_capture.use_cases.daily_workload import (\n    collect_daily_workload,\n    render_daily_workload,\n)\n', '')
          start = text.index('def cmd_daily(args: argparse.Namespace) -> None:\n')
          end = text.index('\ndef cmd_pending(args: argparse.Namespace) -> None:\n', start)
          replacement = '''def cmd_daily(args: argparse.Namespace) -> None:\n    del args\n    from vlog_capture.daily import DailyPipeline\n\n    DailyPipeline().run()\n\n'''
          text = text[:start] + replacement + text[end + 1:]
          start = text.index('def _run_daily_postprocessing() -> None:\n')
          end = text.index('\ndef cmd_manga(args: argparse.Namespace) -> None:\n', start)
          text = text[:start] + text[end + 1:]
          handlers.write_text(text, encoding='utf-8')

          pyproject = Path('apps/capture-vrchat/pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          text = text.replace('vlog-daily = "vlog_capture.daily:main"\n', '')
          pyproject.write_text(text, encoding='utf-8')

          unit = Path('infra/systemd/vlog-daily.service.in')
          text = unit.read_text(encoding='utf-8').replace('ExecStart=@VLOG_UV@ run --frozen vlog-daily', 'ExecStart=@VLOG_UV@ run --frozen vlog daily')
          unit.write_text(text, encoding='utf-8')

          readme = Path('infra/systemd/README.md')
          text = readme.read_text(encoding='utf-8').replace('Entry points are installed from the uv workspace (`vlog-service`, `vlog-daily`, `vlog-operations`); unit files do not construct Python import paths.', 'Entry points are installed from the uv workspace (`vlog`, `vlog-service`, `vlog-operations`); the daily timer runs `vlog daily`. Unit files do not construct Python import paths.')
          readme.write_text(text, encoding='utf-8')

          arch = Path('docs/architecture.md')
          text = arch.read_text(encoding='utf-8').replace('vlog             -> vlog_capture.cli:main\nvlog-service     -> vlog_capture.main:main\nvlog-daily       -> vlog_capture.daily:main\nvlog-operations  -> vlog_capture.operations:main', 'vlog             -> vlog_capture.cli:main\nvlog-service     -> vlog_capture.main:main\nvlog-operations  -> vlog_capture.operations:main')
          arch.write_text(text, encoding='utf-8')

          root = Path('README.md')
          text = root.read_text(encoding='utf-8').replace('`.env.example`のVLog runtime設定は`VLOG_*`が正準です。既存deployment向けの旧環境変数名はruntime互換層だけで受け付けます。systemdではrepository内`.env`を使わず、必要なら`VLOG_ENV_FILE`へ明示的な絶対パスを設定します。', '`.env.example`のVLog runtime設定は`VLOG_*`だけを受け付けます。systemdではrepository内`.env`を使わず、必要なら`VLOG_ENV_FILE`へ明示的な絶対パスを設定します。')
          root.write_text(text, encoding='utf-8')

          test = Path('tests/test_cli_daily.py')
          test.write_text('''from types import SimpleNamespace\n\nfrom vlog_capture import cli_handlers\n\n\ndef test_cmd_daily_uses_canonical_pipeline(monkeypatch) -> None:\n    calls: list[str] = []\n\n    class StubPipeline:\n        def run(self) -> None:\n            calls.append("run")\n\n    monkeypatch.setattr("vlog_capture.daily.DailyPipeline", StubPipeline)\n    cli_handlers.cmd_daily(SimpleNamespace())\n    assert calls == ["run"]\n''', encoding='utf-8')
          PY
          git rm apps/capture-vrchat/src/vlog_capture/use_cases/daily_workload.py tests/test_daily_workload.py
          git rm .github/workflows/unify-daily-runtime.yml
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: unify daily runtime"
          git push origin HEAD:refactor/unify-daily-runtime
