name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: apps/capture-vrchat:packages/memory-domain/src:packages/ingestion/src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --only-group dev
      - run: uv run ruff check apps/capture-vrchat/src packages scripts tests infra/systemd
      - run: uv run ruff format --check apps/capture-vrchat/src packages scripts tests infra/systemd
