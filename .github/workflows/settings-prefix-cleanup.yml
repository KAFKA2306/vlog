name: Settings prefix cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 119
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set one canonical environment prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/capture-vrchat/src/vlog_capture/infrastructure/settings.py')
          text = path.read_text(encoding='utf-8')
          old = '        case_sensitive=False,\n'
          new = '        case_sensitive=False,\n        env_prefix="VLOG_",\n'
          if old not in text:
              raise SystemExit('settings config marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/settings-prefix-cleanup.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: use one canonical environment prefix"
          git push origin HEAD:${{ github.head_ref }}
