name: Production Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'docs/SPEC.md'
      - 'apps/reader/app/api/health/route.ts'
      - 'apps/reader/tests/health-route.test.ts'
      - 'scripts/reader_identity.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  kaflog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://kaflog.vercel.app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify deployment health metadata
        shell: bash
        run: |
          set -euo pipefail

          body="$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            "$BASE_URL/api/health")"

          printf '%s' "$body" > /tmp/kaflog-health.json

          python3 scripts/reader_identity.py /tmp/kaflog-health.json .

      - name: Verify public Reader routes
        shell: bash
        run: |
          set -euo pipefail

          for route in / /timeline /novels /people-said; do
            output="$(mktemp)"
            code="$(curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$output" \
              --write-out '%{http_code}' \
              "$BASE_URL$route")"

            if [[ "$code" -lt 200 || "$code" -ge 400 ]]; then
              echo "route failed: $route -> HTTP $code" >&2
              cat "$output" >&2
              exit 1
            fi

            if ! grep -qi '<html' "$output"; then
              echo "route did not return HTML: $route" >&2
              exit 1
            fi

            echo "route ok: $route -> HTTP $code"
          done
