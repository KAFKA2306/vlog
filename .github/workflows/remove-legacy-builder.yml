name: Remove legacy builder

on:
  push:
    branches: [refactor/remove-all-legacy]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remove-all-legacy
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
      - name: Remove compatibility and transition surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_required(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise SystemExit(f"expected text missing: {path}: {old!r}")
              write(path, text.replace(old, new))

          for path in [
              "scripts/migrate_runtime_state.py",
              "tests/test_runtime_state_migration.py",
              "scripts/phase0_inventory.py",
              "tests/test_phase0_inventory.py",
              "docs/operations/phase0-inventory.md",
              "scripts/social_mirror_backfill.py",
              "tests/test_social_mirror_backfill.py",
              "tests/fixtures/social_mirror_backfill.jsonl",
              "packages/ingestion/README.md",
              "packages/ingestion/pyproject.toml",
              "packages/ingestion/src/vlog_ingestion/__init__.py",
              "packages/ingestion/src/vlog_ingestion/inventory.py",
              "packages/ingestion/src/vlog_ingestion/social_mirror_backfill.py",
          ]:
              target = Path(path)
              if not target.exists():
                  raise SystemExit(f"retired file unexpectedly missing before removal: {path}")
              target.unlink()

          root = read("pyproject.toml")
          root = "\n".join(
              line for line in root.splitlines()
              if "vlog-ingestion" not in line and "packages/ingestion" not in line
          ) + "\n"
          write("pyproject.toml", root)

          capture = read("apps/capture-vrchat/pyproject.toml")
          capture = "\n".join(
              line for line in capture.splitlines()
              if "vlog-ingestion" not in line
          ) + "\n"
          write("apps/capture-vrchat/pyproject.toml", capture)

          settings = read("apps/capture-vrchat/src/vlog_capture/infrastructure/settings.py")
          settings = settings.replace(
              "from pydantic import AliasChoices, Field, field_validator",
              "from pydantic import Field, field_validator",
          )
          replacements = {
              'validation_alias=AliasChoices("VLOG_GEMINI_API_KEY", "GOOGLE_API_KEY"),':
                  'validation_alias="VLOG_GEMINI_API_KEY",',
              'validation_alias=AliasChoices("VLOG_JULES_API_KEY", "GOOGLE_JULES_API_KEY"),':
                  'validation_alias="VLOG_JULES_API_KEY",',
              'validation_alias=AliasChoices("VLOG_SUPABASE_URL", "SUPABASE_URL"),':
                  'validation_alias="VLOG_SUPABASE_URL",',
              'validation_alias=AliasChoices(\n            "VLOG_SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_SERVICE_ROLE_KEY"\n        ),':
                  'validation_alias="VLOG_SUPABASE_SERVICE_ROLE_KEY",',
              'validation_alias=AliasChoices(\n            "VLOG_DISCORD_WEBHOOK_URL", "DISCORD_WEBHOOK_URL"\n        ),':
                  'validation_alias="VLOG_DISCORD_WEBHOOK_URL",',
              'validation_alias=AliasChoices("VLOG_ERROR_LOG_FILE", "VLOG_ERROR_EVENT_FILE"),':
                  'validation_alias="VLOG_ERROR_LOG_FILE",',
          }
          for old, new in replacements.items():
              if old not in settings:
                  raise SystemExit(f"settings alias pattern missing: {old}")
              settings = settings.replace(old, new)
          write("apps/capture-vrchat/src/vlog_capture/infrastructure/settings.py", settings)

          tests = read("tests/test_settings_paths.py")
          pattern = re.compile(
              r"def test_legacy_google_api_key_environment_remains_accepted\([\s\S]*?(?=def test_explicit_env_file_handles_space_hash_and_unicode)",
          )
          replacement = '''def test_retired_google_api_key_alias_is_ignored(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    monkeypatch.delenv("VLOG_GEMINI_API_KEY", raising=False)\n    monkeypatch.setenv("GOOGLE_API_KEY", "retired-key")\n    assert Settings().gemini_api_key == ""\n\n\n'''
          tests, count = pattern.subn(replacement, tests, count=1)
          if count != 1:
              raise SystemExit("failed to replace old environment compatibility tests")
          write("tests/test_settings_paths.py", tests)

          contract = read("scripts/check_runtime_contract.py")
          contract, count = re.subn(
              r"# These tools intentionally operate on versioned/legacy repository data rather than\n# serving as runtime state authorities\.\nLEGACY_DATA_EXCEPTIONS = \{[\s\S]*?\}\n",
              "",
              contract,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to remove runtime compatibility exceptions")
          contract, count = re.subn(
              r"\s{12}if relative in LEGACY_DATA_EXCEPTIONS and token\.startswith\([\s\S]*?\s{12}\):\n\s{16}continue\n",
              "",
              contract,
              count=1,
          )
          if count != 1:
              raise SystemExit("failed to remove runtime exception branch")
          contract = contract.replace("legacy src", "retired src")
          write("scripts/check_runtime_contract.py", contract)

          boundaries = read("scripts/check_repository_boundaries.py")
          for retired_line in [
              '    "packages/ingestion": "packages/ingestion/README.md",\n',
              '    "packages/ingestion",\n',
              '    "scripts/phase0_inventory.py",\n',
              '    "scripts/social_mirror_backfill.py",\n',
          ]:
              boundaries = boundaries.replace(retired_line, "")
          boundaries = boundaries.replace("RETIRED_ROOT_PATHS", "RETIRED_PATHS")
          marker = "RETIRED_PATHS = {\n"
          if marker not in boundaries:
              raise SystemExit("retired-path ratchet marker not found")
          additions = "".join(
              f'    "{path}",\n'
              for path in [
                  "packages/ingestion",
                  "scripts/migrate_runtime_state.py",
                  "scripts/phase0_inventory.py",
                  "scripts/social_mirror_backfill.py",
                  "docs/daily_pipeline_contract.md",
                  "docs/operations/phase0-inventory.md",
              ]
              if f'    "{path}",\n' not in boundaries
          )
          boundaries = boundaries.replace(marker, marker + additions, 1)
          boundaries = boundaries.replace("retired root path", "retired path")
          write("scripts/check_repository_boundaries.py", boundaries)

          architecture = read("docs/architecture.md")
          architecture = architecture.replace("legacy-compatible runtime", "runtime")
          architecture = "\n".join(
              line for line in architecture.splitlines()
              if "daily_pipeline_contract.md" not in line
          ) + "\n"
          write("docs/architecture.md", architecture)

          docs_index = read("docs/README.md")
          docs_index = "\n".join(
              line for line in docs_index.splitlines()
              if "daily_pipeline_contract.md" not in line
              and "operations/phase0-inventory.md" not in line
          ) + "\n"
          write("docs/README.md", docs_index)

          maintenance = read("docs/MAINTENANCE.md")
          maintenance = "\n".join(
              line for line in maintenance.splitlines()
              if "phase0_inventory.py" not in line
              and "operations/phase0-inventory.md" not in line
          ) + "\n"
          maintenance = maintenance.replace(
              "destructive migration前にinventoryを取得し、backup/reconciliationを完了させます。",
              "Evidenceを破壊的に変更する前に、retained backupとprovenance reconciliationを完了させます。",
          )
          write("docs/MAINTENANCE.md", maintenance)

          agents = read("AGENTS.md")
          agents = agents.replace(
              "Do not move or delete Evidence during structural migration until inventory, backup, and reconciliation complete.",
              "Do not destructively modify Evidence without retained backup and provenance reconciliation.",
          )
          write("AGENTS.md", agents)

          target = read("docs/architecture/human-memory-v2.md")
          target = target.replace("Legacy removal", "Retired-system removal")
          target = "\n".join(
              line for line in target.splitlines()
              if "scripts/phase0_inventory.py" not in line
              and "operations/phase0-inventory.md" not in line
          ) + "\n"
          write("docs/architecture/human-memory-v2.md", target)
          PY

          uv lock

          python - <<'PY'
          from pathlib import Path
          forbidden_paths = [
              "packages/ingestion",
              "scripts/migrate_runtime_state.py",
              "scripts/phase0_inventory.py",
              "scripts/social_mirror_backfill.py",
              "docs/daily_pipeline_contract.md",
              "docs/operations/phase0-inventory.md",
          ]
          for path in forbidden_paths:
              if Path(path).exists():
                  raise SystemExit(f"retired path survived: {path}")
          print("legacy-builder: structural removal PASS")
          PY

      - name: Commit generated lock and removals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor: remove compatibility and transition surfaces"
          git push origin HEAD:refactor/remove-all-legacy
