name: Format operations files once

on:
  push:
    branches:
      - agent/vlog-operations-observability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vlog-operations-observability
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --only-group dev
      - run: uv run --no-sync ruff format src/daily.py src/operations.py
      - name: Commit formatted files and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-ops-once.yml
          git add src/daily.py src/operations.py
          git commit -m "style: format operations implementation"
          git push origin HEAD:agent/vlog-operations-observability
