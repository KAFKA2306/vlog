# Temporary self-deleting normalization workflow.
name: Retire CoDD residue

on:
  push:
    branches: [refactor/retire-codd]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/retire-codd
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
      - name: Remove CoDD metadata and refresh lockfile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('.').rglob('*.md'):
              if any(part in {'.git', '.venv', 'node_modules'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              if not lines or lines[0].strip() != '---':
                  continue
              try:
                  end = next(i for i, line in enumerate(lines[1:], 1) if line.strip() == '---')
              except StopIteration:
                  continue
              front = lines[1:end]
              start = next((i for i, line in enumerate(front) if line.strip() == 'codd:' and not line.startswith((' ', '\t'))), None)
              if start is None:
                  continue
              stop = start + 1
              while stop < len(front):
                  line = front[stop]
                  if line.strip() and not line.startswith((' ', '\t')):
                      break
                  stop += 1
              kept = front[:start] + front[stop:]
              if any(line.strip() for line in kept):
                  new_text = ''.join([lines[0], *kept, lines[end], *lines[end + 1:]])
              else:
                  new_text = ''.join(lines[end + 1:]).lstrip('\n')
              path.write_text(new_text, encoding='utf-8')
          PY
          uv lock
          rm .github/workflows/retire-codd.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finish CoDD retirement"
          git push origin HEAD:refactor/retire-codd
