name: Remove legacy PR runner

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/remove-all-legacy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remove-all-legacy
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
      - name: Execute builder payload
        shell: bash
        run: |
          ruby - <<'RUBY'
          require 'yaml'
          workflow = YAML.load_file('.github/workflows/remove-legacy-builder.yml')
          step = workflow.fetch('jobs').fetch('build').fetch('steps').find { |item| item['name'] == 'Remove compatibility and transition surfaces' }
          abort 'builder payload missing' unless step
          File.write('/tmp/remove-legacy.sh', step.fetch('run'))
          RUBY
          bash /tmp/remove-legacy.sh
      - name: Commit generated result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor: remove compatibility and transition surfaces"
          git push origin HEAD:refactor/remove-all-legacy
