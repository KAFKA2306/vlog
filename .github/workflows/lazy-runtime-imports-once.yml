name: Lazy runtime imports once

on:
  push:
    branches:
      - agent/harden-vlog-operations-main
    paths:
      - .github/workflows/lazy-runtime-imports-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-vlog-operations-main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Move heavy native dependencies behind execution boundaries
        shell: python
        run: |
          from pathlib import Path

          ai = Path("src/infrastructure/ai.py")
          text = ai.read_text(encoding="utf-8")
          if not text.startswith("from __future__ import annotations"):
              text = "from __future__ import annotations\n\n" + text
          for line in (
              "import google.generativeai as genai\n",
              "import torch\n",
              "from diffusers import DiffusionPipeline\n",
              "from google.generativeai.types import content_types\n",
              "from PIL import Image\n",
          ):
              text = text.replace(line, "")
          marker = "from src.infrastructure.settings import settings\n\n\n"
          helper = '''from src.infrastructure.settings import settings


def _genai():
    # Heavy provider SDK: import only when an AI operation actually runs.
    import google.generativeai as genai

    return genai


'''
          if marker not in text:
              raise SystemExit("ai.py helper insertion marker not found")
          text = text.replace(marker, helper, 1)
          text = text.replace("genai.configure(", "_genai().configure(")
          text = text.replace("genai.GenerativeModel(", "_genai().GenerativeModel(")
          text = text.replace(
              "history: Iterable[content_types.StrictContentType]", "history: Iterable[Any]"
          )
          text = text.replace("images: Sequence[Image.Image]", "images: Sequence[Any]")
          old = '''    ) -> None:
              if not self._pipe:
                  self._pipe = DiffusionPipeline.from_pretrained(
          '''
          new = '''    ) -> None:
              import torch
              from diffusers import DiffusionPipeline

              if not self._pipe:
                  self._pipe = DiffusionPipeline.from_pretrained(
          '''
          if old not in text:
              raise SystemExit("ImageGenerator.generate insertion point not found")
          text = text.replace(old, new, 1)
          ai.write_text(text, encoding="utf-8")

          system = Path("src/infrastructure/system.py")
          text = system.read_text(encoding="utf-8")
          for line in (
              "import numpy as np\n",
              "import sounddevice as sd\n",
              "import soundfile as sf\n",
          ):
              text = text.replace(line, "")
          old = '''    def _record_loop(self) -> None:
              try:
          '''
          new = '''    def _record_loop(self) -> None:
              # Native audio dependencies load only in the recorder worker.
              import numpy as np
              import sounddevice as sd
              import soundfile as sf

              try:
          '''
          if old not in text:
              raise SystemExit("AudioRecorder._record_loop insertion point not found")
          system.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Format and validate
        run: |
          uvx --from ruff==0.14.9 ruff format src/infrastructure/ai.py src/infrastructure/system.py
          uvx --from ruff==0.14.9 ruff check src/infrastructure/ai.py src/infrastructure/system.py
          python -m compileall -q src/infrastructure/ai.py src/infrastructure/system.py
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/lazy-runtime-imports-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: lazy-load heavy runtime dependencies"
          git push origin HEAD:agent/harden-vlog-operations-main
