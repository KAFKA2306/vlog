name: Format CoDD retirement

on:
  push:
    branches: [refactor/retire-codd]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/retire-codd
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
      - run: uv sync --locked
      - name: Format and self-delete
        shell: bash
        run: |
          uv run --no-sync ruff format scripts/check_repository_boundaries.py
          rm .github/workflows/format-codd-retirement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format CoDD retirement ratchet"
          git push origin HEAD:refactor/retire-codd
