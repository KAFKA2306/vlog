name: Format cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 119
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
      - run: uv sync --locked
      - name: Format changed Python
        run: |
          uv run --no-sync ruff format apps/capture-vrchat/src/vlog_capture/operations.py scripts/check_repository_boundaries.py tests/test_operations.py
          git rm .github/workflows/format-cleanup.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format retired-surface cleanup"
          git push origin HEAD:${{ github.head_ref }}
