name: Test and Security Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: test-key
      PYTHONPATH: apps/capture-vrchat:packages/memory-domain/src:packages/ingestion/src:packages/companion/src:adapters/vrchat-osc/src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv
      - name: Install focused test dependencies
        run: >-
          uv pip install
          pytest
          pydantic-settings
          pyyaml
          python-dotenv
          supabase
          pillow
          numpy
          psutil
          sounddevice
          soundfile
          google-generativeai
      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q apps/capture-vrchat/src packages adapters scripts tests infra/systemd
      - name: Lint Python sources
        run: uvx ruff check apps/capture-vrchat/src packages adapters scripts tests infra/systemd
      - name: Check Python formatting
        run: uvx ruff format --check apps/capture-vrchat/src packages scripts tests infra/systemd
      - name: Enforce canonical repository ratchet
        run: |
          grep -Fq 'Evidence -> Human Memory -> Narrative Artifact -> Public Projection' docs/architecture/human-memory-v2.md
          grep -Fq 'Graphiti, Cognee, pgvector, and Qdrant are rebuildable projections' docs/architecture/human-memory-v2.md
          grep -Fq '## 5. 動作保証' docs/SPEC.md
          grep -Fq 'https://kaflog.vercel.app' .github/workflows/production-smoke.yml
          test ! -e .github/workflows/weekly-repo-research.yml
      - name: Enforce public/private repository boundaries
        run: uv run --no-sync python scripts/check_repository_boundaries.py
      - name: Enforce companion browser/runtime parity
        run: uv run --no-sync python scripts/check_companion_contract_parity.py
      - name: Verify rendered systemd units
        run: |
          output="$(mktemp -d)"
          python3 infra/systemd/render.py --root "$PWD" --output "$output"
          systemd-analyze --user verify "$output"/*.service "$output"/*.timer
      - name: Run tests
        run: uv run --no-sync pytest -q
      - name: Verify clean checkout
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache .ruff_cache
          test -z "$(git status --porcelain --untracked-files=all)"

  reader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run design:check
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Verify clean checkout
        working-directory: .
        run: test -z "$(git status --porcelain --untracked-files=all)"
