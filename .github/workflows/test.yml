name: Test and Security Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GOOGLE_API_KEY: test-key
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
      - name: Sync locked Python workspace
        run: uv sync --locked
      - name: Reject non-portable tracked paths
        run: uv run --no-sync python scripts/check_portable_paths.py
      - name: Reject checkout-layout runtime coupling
        run: uv run --no-sync python scripts/check_runtime_contract.py
      - name: Compile portability tools
        run: uv run --no-sync python -m compileall -q apps/capture-vrchat/src/vlog_capture/portability.py scripts/check_portable_paths.py scripts/check_runtime_contract.py scripts/vlog_doctor.py
      - name: Run read-only portability doctor
        run: uv run --no-sync python scripts/vlog_doctor.py --json --redact --strict
      - name: Verify installed entry point
        run: uv run --no-sync vlog --help
      - name: Parse Windows PowerShell assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem infra/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

  devcontainer:
    name: Dev Container (Linux tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build fresh Dev Container and run portable gates
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            uv sync --locked
            uv run --no-sync python scripts/check_portable_paths.py
            uv run --no-sync python scripts/check_runtime_contract.py
            uv run --no-sync ruff check apps/capture-vrchat/src packages adapters scripts tests infra/systemd
            uv run --no-sync pytest -q
            cd apps/reader
            bun install --frozen-lockfile
            bun run test
            bun run typecheck
            bun run lint
            bun run build

  python:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: test-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
      - name: Sync locked Python workspace
        run: uv sync --locked
      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q apps/capture-vrchat/src packages adapters scripts tests infra/systemd
      - name: Lint Python sources
        run: uv run --no-sync ruff check apps/capture-vrchat/src packages adapters scripts tests infra/systemd
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check apps/capture-vrchat/src packages adapters scripts tests infra/systemd
      - name: Enforce canonical repository ratchet
        run: |
          grep -Fq 'Evidence -> Human Memory -> Narrative Artifact -> Public Projection' docs/architecture/human-memory-v2.md
          grep -Fq 'Graphiti, Cognee, pgvector, and Qdrant are rebuildable projections' docs/architecture/human-memory-v2.md
          grep -Fq '## 5. 動作保証' docs/SPEC.md
          grep -Fq 'physical path is not authority' docs/architecture/portability.md
          grep -Fq 'https://kaflog.vercel.app' .github/workflows/production-smoke.yml
          grep -Fq 'only the default branch and same-repository open-PR heads may persist' .github/workflows/branch-lifecycle.yml
          grep -Fq 'closed PR heads and orphan branches are deleted' .github/workflows/branch-lifecycle.yml
          uv run --no-sync python scripts/check_portable_paths.py
          uv run --no-sync python scripts/check_runtime_contract.py
          test ! -e .github/workflows/weekly-repo-research.yml
      - name: Enforce public/private repository boundaries
        run: uv run --no-sync python scripts/check_repository_boundaries.py
      - name: Enforce companion browser/runtime parity
        run: uv run --no-sync python scripts/check_companion_contract_parity.py
      - name: Verify installed package imports and CLI
        run: |
          uv run --no-sync python -c "import vlog_capture, vlog_memory_domain, vlog_ingestion, vlog_companion, vlog_privacy, vlog_vrchat_osc"
          uv run --no-sync vlog --help
          uv run --no-sync vlog-operations --help
      - name: Verify rendered systemd units
        run: |
          output="$(mktemp -d)"
          uv run --no-sync python infra/systemd/render.py --root "$PWD" --output "$output"
          systemd-analyze --user verify "$output"/*.service "$output"/*.timer
      - name: Run tests
        run: uv run --no-sync pytest -q
      - name: Verify relocated clean checkout
        run: |
          root="$(mktemp -d)/VLog 移動 test"
          mkdir -p "$root"
          git archive HEAD | tar -x -C "$root"
          cd "$root"
          uv sync --locked
          uv run --no-sync vlog --help
          uv run --no-sync python scripts/check_runtime_contract.py
      - name: Verify clean checkout
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache .ruff_cache
          test -z "$(git status --porcelain --untracked-files=all)"

  reader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run design:check
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Verify clean checkout
        working-directory: .
        run: test -z "$(git status --porcelain --untracked-files=all)"
