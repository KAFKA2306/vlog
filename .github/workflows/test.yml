name: Test and Security Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      VLOG_GEMINI_API_KEY: test-key
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
      - name: Sync locked Python workspace
        run: uv sync --locked
      - name: Reject non-portable tracked paths
        run: uv run --no-sync python scripts/check/check_portable_paths.py
      - name: Verify Python support contract
        run: uv run --no-sync python scripts/check/check_python_contract.py
      - name: Reject checkout-layout runtime coupling
        run: uv run --no-sync python scripts/check/check_runtime_contract.py
      - name: Compile portability tools
        run: uv run --no-sync python -m compileall -q apps/capture-vrchat/src/vlog_capture/portability.py scripts/check/check_portable_paths.py scripts/check/check_runtime_contract.py scripts/vlog_doctor.py
      - name: Run read-only portability doctor
        run: uv run --no-sync python scripts/vlog_doctor.py --json --redact --strict
      - name: Verify installed entry point
        run: uv run --no-sync vlog --help
      - name: Parse Windows PowerShell assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem infra/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

  python:
    runs-on: ubuntu-latest
    env:
      VLOG_GEMINI_API_KEY: test-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
      - name: Sync locked Python workspace
        run: uv sync --locked
      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q apps/capture-vrchat/src packages adapters scripts tests infra/systemd
      - name: Lint Python sources
        run: uv run --no-sync ruff check apps/capture-vrchat/src packages adapters scripts tests infra/systemd
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check apps/capture-vrchat/src packages adapters scripts tests infra/systemd
      - name: Enforce public/private repository boundaries
        run: uv run --no-sync python scripts/check/check_repository_boundaries.py
      - name: Verify installed package imports and CLI
        run: |
          uv run --no-sync python -c "import vlog_capture, vlog_memory_domain, vlog_ingestion, vlog_privacy"
          uv run --no-sync vlog --help
          uv run --no-sync vlog-operations --help
      - name: Verify rendered systemd units
        run: |
          output="$(mktemp -d)"
          uv run --no-sync python infra/systemd/render.py --root "$PWD" --output "$output"
          systemd-analyze --user verify "$output"/*.service "$output"/*.timer
      - name: Run tests
        run: uv run --no-sync pytest -q

  reader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reader
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run design:check
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
