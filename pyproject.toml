[project]
name = "vlog"
version = "0.1.0"
description = "VRChat Auto-Diary"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vlog-capture",
    "vlog-memory-domain",
    "vlog-ingestion",
    "vlog-privacy",
    "vlog-vrcpet",
    "vlog-graphiti",
]

[project.optional-dependencies]
gpu = ["vlog-capture[gpu]"]
cognee = ["cognee[all]>=1.0.0"]

[tool.uv.sources]
vlog-capture = { workspace = true }
vlog-memory-domain = { workspace = true }
vlog-ingestion = { workspace = true }
vlog-privacy = { workspace = true }
vlog-vrcpet = { workspace = true }
vlog-graphiti = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/capture-vrchat",
    "packages/memory-domain",
    "packages/ingestion",
    "packages/privacy",
    "adapters/vrcpet",
    "adapters/graphiti",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.9",
    "ty>=0.0.64",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
